version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # arrow-* and lance/lancedb are pinned exactly and must move together
    # (lancedb fixes the arrow major). Group them so one PR bumps the set.
    groups:
      arrow-lance:
        patterns:
          - "arrow*"
          - "lance*"

  - package-ecosystem: "pip"
    directory: "/crates/speclance-py"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
