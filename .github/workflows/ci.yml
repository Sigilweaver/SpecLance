name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # No debuginfo for dev/test builds. With the Lance 14 / DataFusion 54
  # stack, full debuginfo for the workspace test binaries is tens of GB and
  # exhausts the ubuntu-latest runner's disk mid-`cargo test`. Tests run
  # the same code; panics just report without line numbers.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Cross-platform protoc install (apt-get is Linux-only; this action
      # covers the macOS/Windows runners added alongside the wheel matrix).
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: cargo fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: cargo clippy (default features)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (all vendor features)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --features all-vendors -- -D warnings

      # all-vendors enables the same openmassspec-io/all set as the former
      # `--features thermo` step, so one compile covers the default tests and
      # the vendor adapter tests (thermo, bruker, waters).
      - name: cargo test (all vendor features)
        run: cargo test --workspace --all-targets --features all-vendors
        env:
          # Skip corpus-dependent tests in CI; they no-op when the path is absent.
          SPECLANCE_RUN_CORPUS_TESTS: "0"

  python:
    name: Python bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install maturin + pytest
        run: python -m pip install --upgrade pip maturin pytest

      - name: Build wheel
        working-directory: crates/speclance-py
        run: maturin build --release --interpreter python3 --out dist
        env:
          # PR checks only need a wheel that imports and passes pytest. Fat LTO
          # with one codegen unit takes hours on the macOS runner, so build
          # this wheel without LTO. release.yml keeps [profile.release].
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

      - name: Install wheel
        working-directory: crates/speclance-py
        # bash for glob expansion of dist/speclance-*.whl - pwsh (the default
        # shell on windows-latest) does not expand wildcards for external
        # command arguments the way bash does.
        shell: bash
        run: pip install --force-reinstall dist/speclance-*.whl

      - name: pytest
        working-directory: crates/speclance-py
        run: pytest tests/ -q
